# Branch naming configuration for /epic-cycle (Rules SC-1 / SC-2)
#
# Created 2026-08-17 to encode the convention this project has actually used
# since Epic 1. Without this file /epic-cycle falls back to its JIRA-style
# defaults, which do not describe this repo and halt twice at epic start:
#
#   default feature_pattern  feature/{TICKET}_{Description}, TICKET ~ ^[A-Z]+-\d+$
#   default epic_pattern     {TICKET}-epic{N}
#
# With no tracker ID the default epic_pattern resolves to "-epic{N}" — a
# leading-hyphen name that git rejects. The command's own SC-2 section states
# that projects in this mode MUST override epic_pattern; that is the primary
# purpose of this file.

# Feature branches are wave-scoped and carry no tracker ID, so {Description}
# absorbs the whole wave name (e.g. Description = "wave-4-classmethod-fidelity"
# renders feature/feature-wave-4-classmethod-fidelity).
feature_pattern: "feature/feature-{Description}"

# Epic branches are bare "epic{N}" — no ticket prefix. This repo hosts a single
# project, so the shared-namespace collision SC-2 guards against cannot occur.
epic_pattern: "epic{N}"

# This project has never used JIRA / Linear / Azure ticket IDs.
ticket_required: false

description_format: "^[a-z][a-z0-9-]{2,60}$"
separator: "-"

